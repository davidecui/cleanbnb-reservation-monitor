name: Build and Deploy

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: "europe-west4"
  JOB_NAME: "cleanbnb-monitor"
  REPO_NAME: "cleanbnb-monitor-repo"

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Pytest
        run: pytest tests/

  deploy:
    name: Build & Deploy
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.SA_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"

      - name: Terraform Apply - Secrets and IAM
        working-directory: ./terraform
        run: |
          terraform apply -auto-approve \
            -target=google_secret_manager_secret.secrets \
            -target=google_secret_manager_secret_version.secret_versions \
            -target=google_project_iam_member.secret_access \
            -var="project_id=${{ env.PROJECT_ID }}" \
            -var="github_repo=${{ github.repository }}"

      - name: Bootstrap Secret Versions
        run: |
          SECRETS=(
            "${{ env.JOB_NAME }}-cleanbnb-username"
            "${{ env.JOB_NAME }}-cleanbnb-password"
            "${{ env.JOB_NAME }}-cleanbnb-property-id"
            "${{ env.JOB_NAME }}-smtp-password"
            "${{ env.JOB_NAME }}-telegram-bot-token"
          )
          for SECRET in "${SECRETS[@]}"; do
            COUNT=$(gcloud secrets versions list "$SECRET" \
              --filter="state=ENABLED" \
              --format="value(name)" 2>/dev/null | wc -l)
            if [ "$COUNT" = "0" ]; then
              echo -n "placeholder" | gcloud secrets versions add "$SECRET" --data-file=-
              echo "Bootstrapped placeholder version for $SECRET"
            else
              echo "Secret $SECRET already has enabled version(s), skipping"
            fi
          done

      - name: Terraform Apply - Full
        working-directory: ./terraform
        run: |
          terraform apply -auto-approve \
            -var="project_id=${{ env.PROJECT_ID }}" \
            -var="github_repo=${{ github.repository }}"

      - name: Docker Auth
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build and Push Docker Image
        run: |
          IMAGE_TAG=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.JOB_NAME }}:${{ github.sha }}
          docker build -t $IMAGE_TAG .
          docker push $IMAGE_TAG

      - name: Update Cloud Run Job Image
        run: |
          IMAGE_TAG=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.JOB_NAME }}:${{ github.sha }}
          gcloud run jobs update ${{ env.JOB_NAME }} \
            --image $IMAGE_TAG \
            --region ${{ env.REGION }} \
            --update-env-vars=APP_ENV=cloud,STATE_BACKEND=firestore,GCP_PROJECT=${{ env.PROJECT_ID }},TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }} \
            --update-secrets=CLEANBNB_USERNAME=${{ env.JOB_NAME }}-cleanbnb-username:latest,CLEANBNB_PASSWORD=${{ env.JOB_NAME }}-cleanbnb-password:latest,CLEANBNB_PROPERTY_ID=${{ env.JOB_NAME }}-cleanbnb-property-id:latest,SMTP_PASSWORD=${{ env.JOB_NAME }}-smtp-password:latest,TELEGRAM_BOT_TOKEN=${{ env.JOB_NAME }}-telegram-bot-token:latest
